<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Day 4 - Temperature Converter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }
  .card {
    background: #ffffff;
    padding: 32px 36px;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    width: 340px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: #0f172a;
  }
  p.sub {
    margin: 0 0 20px;
    color: #64748b;
    font-size: 14px;
  }
  label {
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    display: block;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
  }
  input:focus, select:focus {
    border-color: #6366f1;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #6366f1;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #4f46e5; }
  .result {
    margin-top: 18px;
    padding: 14px;
    background: #eef2ff;
    border-radius: 8px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #3730a3;
    min-height: 24px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🌡️ Temperature Converter</h1>
  <p class="sub">Day 4 mini project — Functions &amp; Arrow Functions</p>

  <label for="tempValue">Temperature value</label>
  <input type="number" id="tempValue" placeholder="e.g. 37" />

  <label for="fromUnit">Convert from</label>
  <select id="fromUnit">
    <option value="C">Celsius (°C)</option>
    <option value="F">Fahrenheit (°F)</option>
    <option value="K">Kelvin (K)</option>
  </select>

  <label for="toUnit">Convert to</label>
  <select id="toUnit">
    <option value="F">Fahrenheit (°F)</option>
    <option value="C">Celsius (°C)</option>
    <option value="K">Kelvin (K)</option>
  </select>

  <button onclick="handleConvert()">Convert</button>

  <div class="result" id="result"></div>
</div>

<script>
  // ---- Function declarations (Day 4 concept: Functions & Parameters) ----

  // Step 1: convert whatever input unit to Celsius first (a common base)
  function toCelsius(value, unit) {
    if (unit === "C") return value;
    if (unit === "F") return (value - 32) * (5 / 9);
    if (unit === "K") return value - 273.15;
  }

  // Step 2: convert from Celsius to the target unit
  // Written as an Arrow Function (Day 4 concept: Arrow Functions)
  const fromCelsius = (celsius, unit) => {
    if (unit === "C") return celsius;
    if (unit === "F") return celsius * (9 / 5) + 32;
    if (unit === "K") return celsius + 273.15;
  };

  // Step 3: a "master" function that uses the two helper functions above
  // and RETURNS the final result (Day 4 concept: Return Statement)
  function convertTemperature(value, fromUnit, toUnit) {
    const celsius = toCelsius(value, fromUnit);   // local variable -> function scope
    const result = fromCelsius(celsius, toUnit);
    return Math.round(result * 100) / 100; // round to 2 decimal places
  }

  const unitSymbols = { C: "°C", F: "°F", K: "K" };

  // This function handles the button click and updates the page
  function handleConvert() {
    const value = parseFloat(document.getElementById("tempValue").value);
    const fromUnit = document.getElementById("fromUnit").value;
    const toUnit = document.getElementById("toUnit").value;
    const resultBox = document.getElementById("result");

    if (isNaN(value)) {
      resultBox.textContent = "Please enter a valid number.";
      return;
    }

    const converted = convertTemperature(value, fromUnit, toUnit);
    resultBox.textContent =
      `${value}${unitSymbols[fromUnit]} = ${converted}${unitSymbols[toUnit]}`;
  }
</script>

</body>
</html>
