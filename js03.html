<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2a2a40);
    color: #ffffff;
  }

  .card {
    background: #2a2a40;
    padding: 35px 45px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    width: 320px;
  }

  h1 {
    margin-top: 0;
    font-size: 24px;
  }

  .input-group {
    margin: 20px 0 10px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  input[type="number"] {
    padding: 10px;
    font-size: 16px;
    width: 120px;
    border: none;
    border-radius: 8px;
    text-align: center;
  }

  button {
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background: #45a049;
  }

  .reset-btn {
    margin-top: 15px;
    background: #555;
  }

  .reset-btn:hover {
    background: #444;
  }

  .message {
    min-height: 24px;
    font-size: 18px;
    font-weight: bold;
    margin: 10px 0 0;
  }

  .attempts {
    font-size: 14px;
    color: #aaaaaa;
    margin-top: 5px;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>🎯 Number Guessing Game</h1>
    <p>Guess a number between <strong>1</strong> and <strong>100</strong></p>

    <div class="input-group">
      <input type="number" id="guessInput" placeholder="Enter guess" min="1" max="100">
      <button id="guessBtn">Guess</button>
    </div>

    <p id="message" class="message"></p>
    <p id="attempts" class="attempts"></p>

    <button id="resetBtn" class="reset-btn">Reset Game</button>
  </div>

  <script>
    // Game state
    let secretNumber = generateNumber();
    let attempts = 0;
    const maxAttempts = 10;

    // DOM elements
    const guessInput = document.getElementById("guessInput");
    const guessBtn = document.getElementById("guessBtn");
    const resetBtn = document.getElementById("resetBtn");
    const message = document.getElementById("message");
    const attemptsDisplay = document.getElementById("attempts");

    // Generate a random number between 1 and 100
    function generateNumber() {
      return Math.floor(Math.random() * 100) + 1;
    }

    // Handle guess button click
    function checkGuess() {
      const guess = Number(guessInput.value);

      if (!guessInput.value || guess < 1 || guess > 100) {
        message.textContent = "Please enter a valid number (1-100).";
        message.style.color = "orange";
        return;
      }

      attempts++;

      if (guess === secretNumber) {
        message.textContent = `🎉 Correct! The number was ${secretNumber}.`;
        message.style.color = "#4CAF50";
        attemptsDisplay.textContent = `Solved in ${attempts} attempt(s).`;
        guessInput.disabled = true;
        guessBtn.disabled = true;
        return;
      }

      if (guess < secretNumber) {
        message.textContent = "📈 Too low! Try again.";
        message.style.color = "#3399ff";
      } else {
        message.textContent = "📉 Too high! Try again.";
        message.style.color = "#ff5555";
      }

      attemptsDisplay.textContent = `Attempts: ${attempts} / ${maxAttempts}`;

      if (attempts >= maxAttempts) {
        message.textContent = `❌ Game over! The number was ${secretNumber}.`;
        message.style.color = "red";
        guessInput.disabled = true;
        guessBtn.disabled = true;
      }

      guessInput.value = "";
      guessInput.focus();
    }

    // Reset the game
    function resetGame() {
      secretNumber = generateNumber();
      attempts = 0;
      message.textContent = "";
      attemptsDisplay.textContent = "";
      guessInput.disabled = false;
      guessBtn.disabled = false;
      guessInput.value = "";
      guessInput.focus();
    }

    // Event listeners
    guessBtn.addEventListener("click", checkGuess);
    resetBtn.addEventListener("click", resetGame);

    // Allow pressing Enter to guess
    guessInput.addEventListener("keyup", (e) => {
      if (e.key === "Enter") {
        checkGuess();
      }
    });
  </script>
</body>
</html>
