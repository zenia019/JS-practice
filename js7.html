<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f9;
    display: flex;
    justify-content: center;
    padding: 30px;
  }
  .container {
    background: #fff;
    padding: 20px 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    width: 400px;
  }
  h2 { text-align: center; color: #333; }
  .form-group {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  input, select {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
  }
  button:hover { background: #45a049; }
  ul { list-style: none; padding: 0; margin-top: 15px; }
  li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #f9f9f9;
    padding: 8px 12px;
    margin-bottom: 6px;
    border-radius: 5px;
  }
  li.income { border-left: 5px solid #4CAF50; }
  li.expense { border-left: 5px solid #f44336; }
  .delete-btn {
    background: #f44336;
    border: none;
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  .summary {
    margin-top: 20px;
    border-top: 1px solid #ddd;
    padding-top: 10px;
  }
  .summary p { display: flex; justify-content: space-between; margin: 5px 0; }
  .balance { font-weight: bold; font-size: 18px; }
</style>
</head>
<body>

<div class="container">
  <h2>💰 Expense Tracker</h2>

  <div class="form-group">
    <input type="text" id="desc" placeholder="Description">
    <input type="number" id="amount" placeholder="Amount">
  </div>

  <div class="form-group">
    <select id="type">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
    </select>
    <button onclick="addTransaction()">Add</button>
  </div>

  <ul id="transactionList"></ul>

  <div class="summary">
    <p>Total Income: <span id="totalIncome">$0</span></p>
    <p>Total Expense: <span id="totalExpense">$0</span></p>
    <p class="balance">Balance: <span id="balance">$0</span></p>
  </div>
</div>

<script>
  // Array to store all transactions
  let transactions = [];

  // Function to add a transaction
  function addTransaction() {
    const descInput = document.getElementById("desc");
    const amountInput = document.getElementById("amount");
    const typeInput = document.getElementById("type");

    const desc = descInput.value.trim();
    const amount = parseFloat(amountInput.value);
    const type = typeInput.value;

    // Validation using if-else (condition)
    if (desc === "" || isNaN(amount) || amount <= 0) {
      alert("Please enter a valid description and amount.");
      return;
    }

    // Create transaction object
    const transaction = {
      id: Date.now(),
      desc: desc,
      amount: amount,
      type: type
    };

    // Add to array
    transactions.push(transaction);

    // Clear inputs
    descInput.value = "";
    amountInput.value = "";

    // Refresh UI
    renderTransactions();
    updateSummary();
  }

  // Function to delete a transaction
  function deleteTransaction(id) {
    // filter() removes the selected transaction
    transactions = transactions.filter(t => t.id !== id);
    renderTransactions();
    updateSummary();
  }

  // Function to render transactions on the DOM
  function renderTransactions() {
    const list = document.getElementById("transactionList");
    list.innerHTML = ""; // clear list

    // Loop through transactions using forEach
    transactions.forEach(t => {
      const li = document.createElement("li");
      li.className = t.type; // adds "income" or "expense" class

      li.innerHTML = `
        <span>${t.desc} - $${t.amount.toFixed(2)}</span>
        <button class="delete-btn" onclick="deleteTransaction(${t.id})">X</button>
      `;

      list.appendChild(li);
    });
  }

  // Function to calculate and update summary
  function updateSummary() {
    // map()/filter() to get amounts based on type, reduce() to sum them
    const income = transactions
      .filter(t => t.type === "income")
      .reduce((sum, t) => sum + t.amount, 0);

    const expense = transactions
      .filter(t => t.type === "expense")
      .reduce((sum, t) => sum + t.amount, 0);

    const balance = income - expense;

    document.getElementById("totalIncome").innerText = "$" + income.toFixed(2);
    document.getElementById("totalExpense").innerText = "$" + expense.toFixed(2);
    document.getElementById("balance").innerText = "$" + balance.toFixed(2);
  }
</script>

</body>
</html>
